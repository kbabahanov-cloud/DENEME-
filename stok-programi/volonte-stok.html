<title>VOLONTE Stok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #f4f3ef;
    --panel: #ffffff;
    --ink: #17191c;
    --muted: #666b72;
    --line: #e2dfd8;
    --soft: #efece6;
    --accent: #17191c;
    --on-accent: #ffffff;
    --in: #1f7a55;
    --in-soft: #e3f2ea;
    --out: #b2432b;
    --out-soft: #f8e6e1;
    --move: #2f5f9e;
    --move-soft: #e4ecf7;
    --warn: #9a6a00;
    --warn-soft: #fbf0d6;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121416; --panel: #1b1e21; --ink: #eceef0; --muted: #9aa1a8; --line: #2c3035; --soft: #23272b;
      --accent: #eceef0; --on-accent: #121416;
      --in: #5cc896; --in-soft: #16392a; --out: #f08a72; --out-soft: #45221b;
      --move: #86b0ea; --move-soft: #1c2b40; --warn: #e4b54a; --warn-soft: #3a2f12;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121416; --panel: #1b1e21; --ink: #eceef0; --muted: #9aa1a8; --line: #2c3035; --soft: #23272b;
    --accent: #eceef0; --on-accent: #121416;
    --in: #5cc896; --in-soft: #16392a; --out: #f08a72; --out-soft: #45221b;
    --move: #86b0ea; --move-soft: #1c2b40; --warn: #e4b54a; --warn-soft: #3a2f12;
  }

  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45; }
  .app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 80px; display: grid; gap: 16px; }
  h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 22px; letter-spacing: .14em; font-weight: 700; }
  .brand span { font-size: 13px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .status { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .status.ok { background: var(--in-soft); color: var(--in); }
  .status.bad { background: var(--out-soft); color: var(--out); }

  nav.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--soft); padding: 4px; border-radius: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  nav.tabs button { border: 0; background: transparent; padding: 10px 2px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
  nav.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 12px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--move); outline-offset: 2px; }
  input.big { font-family: var(--mono); font-size: 26px; padding: 14px; letter-spacing: .04em; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); padding: 13px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.danger { background: transparent; color: var(--out); border-color: var(--out); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { position: relative; border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px; text-align: center; color: var(--ink); font-size: 14px; cursor: pointer; background: var(--bg); }
  .seg input:checked + span { font-weight: 700; }
  .seg label:has(input:checked) { border-color: var(--c); background: var(--cs); color: var(--c); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--move); outline-offset: 2px; }

  .card-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; flex-wrap: wrap; }
  .code { font-family: var(--mono); font-size: 28px; font-weight: 600; }
  .price { font-family: var(--mono); font-size: 22px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 14px; }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 700; border-bottom: 0; }

  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .pill.zero { background: var(--out-soft); color: var(--out); }
  .pill.low { background: var(--warn-soft); color: var(--warn); }

  .list { display: grid; gap: 0; }
  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
  .item:hover { background: var(--soft); }
  .item .k { font-family: var(--mono); font-weight: 600; min-width: 64px; }
  .item .t { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .item .t small { display: block; color: var(--muted); font-size: 11px; font-family: var(--sans); }

  .log { display: grid; }
  .log div { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; align-items: baseline; }
  .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .tag.giris { background: var(--in-soft); color: var(--in); }
  .tag.satis { background: var(--out-soft); color: var(--out); }
  .tag.transfer { background: var(--move-soft); color: var(--move); }
  .tag.sayim { background: var(--warn-soft); color: var(--warn); }

  .bakiye { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bakiye.pos { color: var(--move); }
  .bakiye.neg { color: var(--warn); }
  .bakiye small { display: block; font-family: var(--sans); font-weight: 500; font-size: 11px; color: var(--muted); text-align: right; }
  .detay { background: var(--bg); }
  #cari-detay { scroll-margin-top: 72px; }
  .tag.tahsilat { background: var(--in-soft); color: var(--in); }
  .tag.odeme, .tag.alis { background: var(--move-soft); color: var(--move); }
  .tag.acilis { background: var(--soft); color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
  .msg { padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  .msg.err { background: var(--out-soft); color: var(--out); }
  .msg.ok { background: var(--in-soft); color: var(--in); }
  .msg.info { background: var(--soft); color: var(--muted); }

  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--accent); color: var(--on-accent); padding: 12px 18px; border-radius: 12px; font-size: 15px; max-width: calc(100% - 32px); z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.2); }

  @media (max-width: 520px) {
    .row3 { grid-template-columns: 1fr 1fr; }
    .code { font-size: 24px; }
  }
  .sec { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .xbtn { border: 0; background: none; color: var(--out); font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; }
  .ozet { display: grid; gap: 4px; font-size: 15px; }
  .ozet div { display: flex; justify-content: space-between; gap: 12px; }
  .ozet .son { font-weight: 700; font-size: 18px; border-top: 1px solid var(--line); padding-top: 6px; }
  .ozet span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .yuzde { display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--move-soft); color: var(--move); }
  .tag.stokgiris { background: var(--in-soft); color: var(--in); }
  @media (max-width: 520px) { .row.m1 { grid-template-columns: 1fr; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>VOLONTE</h1><span>Stok</span></div>
    <span class="status" id="durum">Bağlanıyor…</span>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="satis">Satış</button>
    <button role="tab" aria-selected="false" data-tab="giris">Giriş</button>
    <button role="tab" aria-selected="false" data-tab="stok">Stok</button>
    <button role="tab" aria-selected="false" data-tab="cariler">Cariler</button>
    <button role="tab" aria-selected="false" data-tab="gecmis">Geçmiş</button>
  </nav>

  <!-- SATIŞ -->
  <section id="p-satis" class="panel" role="tabpanel">
    <h2 style="font-size:18px">Satış</h2>
    <label for="s-cari">Satış carisi<select id="s-cari"></select></label>
    <div class="panel" style="padding:12px;background:var(--bg)">
      <span class="sec">Ürün ekle</span>
      <div class="row">
        <label for="s-kod">Stok kodu<input id="s-kod" class="mono" list="kodlar" autocomplete="off"></label>
        <label for="s-renk">Renk<select id="s-renk"><option value="">Önce kodu yazın</option></select></label>
      </div>
      <div class="row3">
        <label for="s-yer">Nereden<select id="s-yer"><option value="magaza">Mağaza</option><option value="fabrika">Fabrika</option></select></label>
        <label for="s-adet">Adet<input id="s-adet" class="mono" type="number" inputmode="numeric" min="1" step="1"></label>
        <label for="s-fiyat">Birim fiyat ($)<input id="s-fiyat" class="mono" type="number" inputmode="decimal" min="0" step="0.01"></label>
      </div>
      <div id="s-uyari"></div>
      <button class="btn ghost" type="button" id="s-ekle">+ Listeye ekle</button>
    </div>
    <div id="s-liste"></div>
    <label for="s-not">Not (isteğe bağlı)<input id="s-not" autocomplete="off"></label>
    <div id="s-mesaj"></div>
    <button class="btn" type="button" id="s-kaydet" disabled>Satışı kaydet</button>
  </section>

  <!-- GİRİŞ -->
  <section id="p-giris" class="panel" role="tabpanel" hidden>
    <h2 style="font-size:18px">Mal girişi</h2>
    <label for="g-cari">Giriş carisi<select id="g-cari"></select></label>
    <p class="sub" id="g-cari-bilgi"></p>
    <div class="panel" style="padding:12px;background:var(--bg)">
      <span class="sec">Ürün ekle</span>
      <div class="row">
        <label for="g-kod">Stok kodu<input id="g-kod" class="mono" list="kodlar" autocomplete="off"></label>
        <label for="g-renk">Renk<input id="g-renk" list="g-renkler" autocomplete="off" placeholder="Örn. Siyah"></label>
      </div>
      <datalist id="g-renkler"></datalist>
      <div class="row3">
        <label for="g-yer">Nereye<select id="g-yer"><option value="magaza">Mağaza</option><option value="fabrika">Fabrika</option></select></label>
        <label for="g-adet">Adet<input id="g-adet" class="mono" type="number" inputmode="numeric" min="1" step="1"></label>
        <label for="g-fiyat">Birim fiyat ($)<input id="g-fiyat" class="mono" type="number" inputmode="decimal" min="0" step="0.01"></label>
      </div>
      <div id="g-uyari"></div>
      <button class="btn ghost" type="button" id="g-ekle">+ Listeye ekle</button>
    </div>
    <div id="g-liste"></div>
    <label for="g-not">Not (isteğe bağlı)<input id="g-not" autocomplete="off"></label>
    <div id="g-mesaj"></div>
    <button class="btn" type="button" id="g-kaydet" disabled>Girişi kaydet</button>
  </section>

  <!-- STOK -->
  <section id="p-stok" class="panel" role="tabpanel" hidden>
    <label for="ara-kod">Stok kodu ara
      <input id="ara-kod" class="big" autocomplete="off" placeholder="3394" list="kodlar">
    </label>
    <div id="ara-sonuc"></div>

    <details class="panel" style="padding:12px;background:var(--bg)">
      <summary class="sec" style="cursor:pointer">Transfer / Sayım düzeltmesi</summary>
      <form id="f-duz" class="panel" style="padding:12px 0 0;border:0;background:none" autocomplete="off">
        <div class="row">
          <label for="d-tip">İşlem<select id="d-tip"><option value="transfer">Transfer (Fabrika → Mağaza)</option><option value="sayim">Sayım (doğru sayıyı yaz)</option></select></label>
          <label for="d-yer" id="d-yer-kutu" hidden>Yer<select id="d-yer"><option value="magaza">Mağaza</option><option value="fabrika">Fabrika</option></select></label>
        </div>
        <div class="row3">
          <label for="d-kod">Stok kodu<input id="d-kod" class="mono" list="kodlar"></label>
          <label for="d-renk">Renk<select id="d-renk"><option value="">Kod yazın</option></select></label>
          <label for="d-adet"><span id="d-adet-etiket">Adet</span><input id="d-adet" class="mono" type="number" inputmode="numeric" min="0" step="1"></label>
        </div>
        <div id="d-mesaj"></div>
        <button class="btn" type="submit">Kaydet</button>
      </form>
    </details>

    <div class="card-head">
      <h2 style="font-size:18px">Ürünler <span class="sub" id="urun-sayisi"></span></h2>
      <button class="btn ghost" type="button" id="yeni-ac">+ Yeni ürün</button>
    </div>
    <form id="f-yeni" class="panel" hidden autocomplete="off">
      <div class="row">
        <label for="y-kod">Stok kodu<input id="y-kod" class="mono" required placeholder="3394"></label>
        <label for="y-fiyat">Satış fiyatı ($)<input id="y-fiyat" class="mono" type="number" inputmode="decimal" min="0" step="0.01"></label>
      </div>
      <label for="y-ad">Model adı<input id="y-ad" placeholder="Örn. Uzun abiye"></label>
      <label for="y-renkler">Renkler (virgülle ayırın)<input id="y-renkler" required placeholder="Siyah, Bordo, Bej"></label>
      <div id="y-mesaj"></div>
      <div class="actions"><button class="btn" type="submit">Ürünü kaydet</button><button class="btn ghost" type="button" id="yeni-kapat">Vazgeç</button></div>
    </form>
    <div class="row">
      <label for="liste-ara">Listede ara<input id="liste-ara" placeholder="Kod veya ad"></label>
      <label for="liste-filtre">Göster<select id="liste-filtre"><option value="hepsi">Hepsi</option><option value="tukenen">Tükenenler</option><option value="az">Azalanlar</option></select></label>
    </div>
    <div class="list" id="liste"></div>
  </section>

  <!-- CARİLER -->
  <section id="p-cariler" class="panel" role="tabpanel" hidden>
    <div class="card-head">
      <h2 style="font-size:18px">Cari kartlar <span class="sub" id="cari-sayisi"></span></h2>
      <button class="btn" type="button" id="cari-yeni-ac">+ Yeni cari</button>
    </div>
    <form id="f-cari" class="panel" hidden autocomplete="off">
      <div class="row m1">
        <label for="c-ad">Cari adı<input id="c-ad" required placeholder="Örn. BLACKROSE 20"></label>
        <label for="c-tur">Tür<select id="c-tur"><option value="satis">Satış carisi</option><option value="giris">Giriş carisi</option><option value="gider">Gider hesabı</option></select></label>
      </div>
      <div class="row">
        <label for="c-yuzde" id="c-yuzde-kutu" hidden>Yüzde (girişte düşülür)<input id="c-yuzde" class="mono" type="number" inputmode="numeric" min="0" max="100" step="1" value="0"></label>
        <label for="c-tel">Telefon (isteğe bağlı)<input id="c-tel" inputmode="tel"></label>
      </div>
      <div id="c-mesaj"></div>
      <div class="actions"><button class="btn" type="submit">Cariyi kaydet</button><button class="btn ghost" type="button" id="cari-yeni-kapat">Vazgeç</button></div>
    </form>
    <div id="cari-detay"></div>
    <div class="row">
      <label for="cari-ara">Cari ara<input id="cari-ara" placeholder="Cari adı"></label>
      <label for="cari-filtre">Göster<select id="cari-filtre"><option value="hepsi">Hepsi</option><option value="satis">Satış carileri</option><option value="giris">Giriş carileri</option><option value="gider">Gider hesapları</option><option value="A">(A) bakiyeli olanlar</option><option value="B">(B) bakiyeli olanlar</option></select></label>
    </div>
    <div class="list" id="cari-liste"></div>
  </section>

  <!-- GEÇMİŞ -->
  <section id="p-gecmis" class="panel" role="tabpanel" hidden>
    <div class="card-head">
      <h2 style="font-size:18px">Günün hareketleri</h2>
      <input id="gc-tarih" type="date" style="width:auto">
    </div>
    <div id="gc-ozet" class="sub"></div>
    <div class="log" id="gc-liste"></div>
  </section>

  <datalist id="kodlar"></datalist>
</div>
<div id="toast" hidden></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => Number(n || 0).toLocaleString("tr-TR");
  const para = n => "$" + Number(n || 0).toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const yuvarla = n => Math.round(Number(n || 0) * 100) / 100;
  const bugun = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const saat = () => new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  const KOD_RE = /^[A-Za-z0-9_-]{1,40}$/;
  const YER = { magaza: "Mağaza", fabrika: "Fabrika" };
  const TUR = { satis: "Satış carisi", giris: "Giriş carisi", gider: "Gider hesabı" };
  // Cari bakiyesi Vegawin'deki gibi carinin tarafından tutulur:
  //   pozitif = (A) cari alacaklı  → mal girişi ekler, ödeme düşer
  //   negatif = (B) cari borçlu    → satış ekler, tahsilat düşer
  const CTIP = {
    satis:    { ad: "Satış",           isaret: -1 },
    giris:    { ad: "Mal girişi",      isaret: +1 },
    tahsilat: { ad: "Tahsilat",        isaret: +1, aciklama: "Cariden para aldık. (B) bakiyesi azalır." },
    odeme:    { ad: "Ödeme",           isaret: -1, aciklama: "Cariye para ödedik. (A) bakiyesi azalır." },
    acilis:   { ad: "Açılış bakiyesi", isaret: 0,  aciklama: "Vegawin'deki bakiyeyi bir kez girin." }
  };
  const AZ_ESIK = 3;

  let db = null;
  const urunler = new Map();
  const cariler = new Map();

  let toastTimer;
  function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3500); }
  function durum(t, cls) { const el = $("durum"); el.textContent = t; el.className = "status " + (cls || ""); }
  const msg = (id, t, cls) => { $(id).innerHTML = t ? '<p class="msg ' + (cls || "err") + '">' + esc(t) + "</p>" : ""; };
  function hata(e) { return e && e.code === "quota_exceeded" ? "Veritabanı dolu. Claude'a haber verin." : "Kaydedilemedi (" + (e?.code || "hata") + "). İnternet bağlantınızı kontrol edip tekrar deneyin."; }
  function renkler(u) { return Object.keys(u?.renkler || {}).sort((a, b) => a.localeCompare(b, "tr")); }
  function stok(u, r) { const s = u?.renkler?.[r] || {}; return { magaza: Number(s.magaza || 0), fabrika: Number(s.fabrika || 0) }; }
  function toplam(u) { return renkler(u).reduce((t, r) => { const s = stok(u, r); t.magaza += s.magaza; t.fabrika += s.fabrika; return t; }, { magaza: 0, fabrika: 0 }); }
  function bakiye(c) { return yuvarla((c.hareketler || []).reduce((t, x) => t + Number(x.etki || 0), 0)); }
  function bakiyeHtml(b) {
    if (Math.abs(b) < 0.005) return '<span class="bakiye">' + para(0) + "<small>Kapalı</small></span>";
    return b > 0 ? '<span class="bakiye pos">' + para(b) + " (A)</span>" : '<span class="bakiye neg">' + para(-b) + " (B)</span>";
  }

  let kuyruk = Promise.resolve();
  const sirayla = fn => (kuyruk = kuyruk.then(fn, fn));

  // ---------- Sekmeler ----------
  const SEKMELER = ["satis", "giris", "stok", "cariler", "gecmis"];
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => sekme(b.dataset.tab)));
  function sekme(ad) {
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ad)));
    SEKMELER.forEach(p => { $("p-" + p).hidden = p !== ad; });
    if (ad === "gecmis") gecmisYukle();
  }

  // ---------- Ortak: günlüğe ve cariye yazma ----------
  async function gunlugeEkle(kayitlar) {
    const ref = db.doc("gunluk/" + bugun());
    const g = await ref.get();
    const liste = g.exists ? (g.data().kayitlar || []).slice() : [];
    liste.push(...kayitlar);
    await ref.set({ tarih: bugun(), kayitlar: liste });
  }
  async function cariHareketEkle(id, x) {
    const ref = db.doc("cariler/" + id);
    const g = await ref.get();
    if (!g.exists) throw { code: "cari_yok" };
    const list = (g.data().hareketler || []).slice();
    list.push({ zaman: new Date().toISOString(), tarih: bugun(), ...x });
    await ref.update({ hareketler: list, guncelleme: new Date().toISOString() });
  }
  function cariSecenekleri(sel, tur) {
    const onceki = sel.value;
    const arr = [...cariler.entries()].filter(([, c]) => c.tur === tur).sort((a, b) => String(a[1].ad).localeCompare(String(b[1].ad), "tr"));
    sel.innerHTML = arr.length
      ? '<option value="">Cari seçin</option>' + arr.map(([id, c]) => '<option value="' + esc(id) + '">' + esc(c.ad) + (tur === "giris" ? " · %" + num(c.yuzde || 0) : "") + "</option>").join("")
      : '<option value="">Önce Cariler sekmesinden ' + (tur === "giris" ? "bir giriş carisi" : "bir satış carisi") + " ekleyin</option>";
    if (cariler.has(onceki)) sel.value = onceki;
  }

  // ---------- Sepet (Satış ve Giriş için ortak) ----------
  function sepet(p, mod) {
    const satir = [];
    const el = id => $(p + "-" + id);
    const yuzde = () => mod === "giris" ? Number(cariler.get(el("cari").value)?.yuzde || 0) : 0;

    function renkGuncelle() {
      const u = urunler.get(el("kod").value.trim());
      if (mod === "satis") {
        const sel = el("renk"), onceki = sel.value;
        sel.innerHTML = u ? '<option value="">Renk seçin</option>' + renkler(u).map(r => '<option value="' + esc(r) + '">' + esc(r) + "</option>").join("") : '<option value="">Önce geçerli bir kod yazın</option>';
        if (u?.renkler?.[onceki]) sel.value = onceki;
      } else {
        $("g-renkler").innerHTML = u ? renkler(u).map(r => '<option value="' + esc(r) + '">').join("") : "";
      }
      if (u && mod === "satis" && !el("fiyat").dataset.elle) el("fiyat").value = u.fiyat || "";
      uyar();
    }
    // Bu sepette aynı kod/renk/yer için zaten eklenmiş adet
    const sepettekiAdet = (kod, renk, yer) => satir.filter(x => x.kod === kod && x.renk === renk && x.yer === yer).reduce((t, x) => t + x.adet, 0);
    function kontrol() {
      const kod = el("kod").value.trim(), renk = el("renk").value.trim(), yer = el("yer").value;
      const adet = Number(el("adet").value), fiyat = Number(el("fiyat").value);
      const u = urunler.get(kod);
      if (!kod) return { hata: null };
      if (mod === "satis" && !u) return { hata: "Bu kodla ürün yok: " + kod };
      if (mod === "giris" && !u && !KOD_RE.test(kod)) return { hata: "Stok kodu sadece harf, rakam, - ve _ içerebilir." };
      if (!renk) return { hata: null };
      if (!el("adet").value) return { hata: null };
      if (!Number.isInteger(adet) || adet <= 0) return { hata: "Adet pozitif bir tam sayı olmalı." };
      if (el("fiyat").value === "" || !(fiyat >= 0)) return { hata: "Birim fiyatı yazın." };
      if (mod === "satis") {
        const var_ = stok(u, renk)[yer] - sepettekiAdet(kod, renk, yer);
        if (adet > var_) return { hata: "Stok yetmiyor: " + YER[yer].toLocaleLowerCase("tr") + "da " + kod + " " + renk + " için " + num(Math.max(var_, 0)) + " adet var." };
      }
      return { ok: { kod, renk, yer, adet, fiyat: yuvarla(fiyat), yeni: !u, yeniRenk: !!u && !u.renkler?.[renk] } };
    }
    function uyar() {
      const k = kontrol();
      if (k.hata) return msg(p + "-uyari", k.hata);
      if (k.ok?.yeni) return msg(p + "-uyari", k.ok.kod + " yeni bir ürün olarak eklenecek. Satış fiyatını sonra Stok sekmesinden yazın.", "info");
      if (k.ok?.yeniRenk) return msg(p + "-uyari", k.ok.renk + " bu ürüne yeni renk olarak eklenecek.", "info");
      msg(p + "-uyari", "");
    }
    function ciz() {
      const brut = yuvarla(satir.reduce((t, x) => t + x.adet * x.fiyat, 0));
      const y = yuzde(), net = yuvarla(brut * (1 - y / 100));
      el("kaydet").disabled = !satir.length;
      if (!satir.length) { el("liste").innerHTML = '<p class="empty">Liste boş. Yukarıdan ürün ekleyin.</p>'; return; }
      el("liste").innerHTML =
        '<div class="tablewrap"><table><thead><tr><th>Ürün</th><th class="n">Adet</th><th class="n">Fiyat</th><th class="n">Tutar</th><th></th></tr></thead><tbody>' +
        satir.map((x, i) => '<tr><td><b class="mono">' + esc(x.kod) + "</b> " + esc(x.renk) + '<br><span class="sub">' + YER[x.yer] + "</span></td>" +
          '<td class="n">' + num(x.adet) + '</td><td class="n">' + para(x.fiyat) + '</td><td class="n">' + para(x.adet * x.fiyat) + '</td><td><button type="button" class="xbtn" data-sil="' + i + '" aria-label="Satırı sil">×</button></td></tr>').join("") +
        "</tbody></table></div>" +
        '<div class="ozet">' +
          (mod === "giris" ? "<div><span>Brüt</span><span>" + para(brut) + "</span></div><div><span>Yüzde (%" + num(y) + ") düşülür</span><span>−" + para(brut - net) + '</span></div><div class="son"><span>Cariye yazılacak</span><span>' + para(net) + "</span></div>"
                           : '<div class="son"><span>Toplam (' + num(satir.reduce((t, x) => t + x.adet, 0)) + " adet)</span><span>" + para(brut) + "</span></div>") +
        "</div>";
      el("liste").querySelectorAll("[data-sil]").forEach(b => b.addEventListener("click", () => { satir.splice(Number(b.dataset.sil), 1); ciz(); uyar(); }));
    }

    el("kod").addEventListener("input", () => { delete el("fiyat").dataset.elle; renkGuncelle(); });
    el("fiyat").addEventListener("input", () => { el("fiyat").dataset.elle = "1"; uyar(); });
    ["renk", "yer", "adet"].forEach(id => el(id).addEventListener("input", uyar));
    el("cari").addEventListener("change", () => { ciz(); if (mod === "giris") cariBilgi(); });
    el("ekle").addEventListener("click", () => {
      const k = kontrol();
      if (!k.ok) return msg(p + "-uyari", k.hata || "Kod, renk, adet ve fiyatı doldurun.");
      satir.push(k.ok); ciz();
      el("adet").value = ""; msg(p + "-uyari", ""); el("adet").focus();
    });
    function cariBilgi() {
      const c = cariler.get(el("cari").value);
      $("g-cari-bilgi").innerHTML = c ? 'Bu carinin yüzdesi: <span class="yuzde">%' + num(c.yuzde || 0) + "</span> · Güncel bakiye: " + bakiyeHtml(bakiye(c)) : "";
    }

    el("kaydet").addEventListener("click", () => {
      const cid = el("cari").value, c = cariler.get(cid);
      if (!c) return msg(p + "-mesaj", "Önce " + (mod === "giris" ? "giriş" : "satış") + " carisini seçin.");
      if (!satir.length) return;
      // Satışta son bir kez stok kontrolü (başka cihazdan değişmiş olabilir)
      if (mod === "satis") {
        const ihtiyac = {};
        satir.forEach(x => { const k = x.kod + "|" + x.renk + "|" + x.yer; ihtiyac[k] = (ihtiyac[k] || 0) + x.adet; });
        for (const k in ihtiyac) { const [kod, renk, yer] = k.split("|"); if (stok(urunler.get(kod), renk)[yer] < ihtiyac[k]) return msg(p + "-mesaj", "Stok değişmiş: " + kod + " " + renk + " (" + YER[yer] + ") için yeterli adet yok. Listeyi kontrol edin."); }
      }
      const y = yuzde();
      const brut = yuvarla(satir.reduce((t, x) => t + x.adet * x.fiyat, 0));
      const net = yuvarla(brut * (1 - y / 100));
      const zaman = new Date().toISOString(), not = el("not").value.trim();
      const kalemler = satir.slice();
      el("kaydet").disabled = true;
      sirayla(async () => {
        try {
          // 1) Stok: her ürün için tek güncelleme
          const grup = {};
          kalemler.forEach(x => { (grup[x.kod] = grup[x.kod] || []).push(x); });
          const loglar = [];
          for (const kod in grup) {
            const u = urunler.get(kod);
            const yeniRenkler = {};
            grup[kod].forEach(x => {
              const s = yeniRenkler[x.renk] || stok(u, x.renk);
              const once = { ...s };
              s[x.yer] += mod === "satis" ? -x.adet : x.adet;
              yeniRenkler[x.renk] = s;
              loglar.push({ saat: saat(), zaman, kod, renk: x.renk, tip: mod === "satis" ? "satis" : "giris", yer: x.yer, miktar: x.adet, fiyat: x.fiyat, once, sonra: { ...s }, cari: c.ad, not });
            });
            if (u) await db.doc("urunler/" + kod).update({ renkler: yeniRenkler, guncelleme: zaman });
            else await db.doc("urunler/" + kod).set({ kod, ad: "", fiyat: 0, renkler: yeniRenkler, olusturma: zaman, guncelleme: zaman });
          }
          // 2) Günlük
          await gunlugeEkle(loglar);
          // 3) Cari
          const aciklama = kalemler.map(x => x.kod + " " + x.renk + " ×" + x.adet).join(", ");
          try {
            await cariHareketEkle(cid, { tip: mod, brut, yuzde: y, tutar: mod === "giris" ? net : brut, etki: CTIP[mod].isaret * (mod === "giris" ? net : brut), aciklama: aciklama + (not ? " · " + not : "") });
          } catch (e) {
            msg(p + "-mesaj", "Stok kaydedildi ama " + c.ad + " carisine yazılamadı. Cariler sekmesinden kontrol edin.");
            satir.length = 0; ciz(); return;
          }
          satir.length = 0; el("not").value = ""; ciz(); msg(p + "-mesaj", "");
          toast((mod === "satis" ? "Satış" : "Giriş") + " kaydedildi: " + c.ad + " · " + para(mod === "giris" ? net : brut));
          if (mod === "giris") cariBilgi();
        } catch (e) { msg(p + "-mesaj", hata(e)); el("kaydet").disabled = false; }
      });
    });

    ciz();
    return { renkGuncelle, ciz, cariBilgi };
  }
  const satisSepet = sepet("s", "satis");
  const girisSepet = sepet("g", "giris");

  // ---------- Stok: arama ----------
  $("ara-kod").addEventListener("input", araCiz);
  function araCiz() {
    const kod = $("ara-kod").value.trim(), box = $("ara-sonuc");
    if (!kod) { box.innerHTML = ""; return; }
    const u = urunler.get(kod);
    if (!u) { box.innerHTML = '<p class="msg info">Bu kodla bir ürün yok: <b class="mono">' + esc(kod) + "</b></p>"; return; }
    const t = toplam(u);
    box.innerHTML =
      '<div class="card-head"><div><div class="code">' + esc(u.kod) + '</div><div class="sub">' + esc(u.ad || "Model adı yok") + '</div></div><div class="price">' + para(u.fiyat) + '<div class="sub" style="text-align:right">satış fiyatı</div></div></div>' +
      '<div class="tablewrap"><table><thead><tr><th>Renk</th><th class="n">Mağaza</th><th class="n">Fabrika</th><th class="n">Toplam</th></tr></thead><tbody>' +
      renkler(u).map(r => { const s = stok(u, r), top = s.magaza + s.fabrika; return "<tr><td>" + esc(r) + (top === 0 ? ' <span class="pill zero">Tükendi</span>' : top <= AZ_ESIK ? ' <span class="pill low">Az</span>' : "") + '</td><td class="n">' + num(s.magaza) + '</td><td class="n">' + num(s.fabrika) + '</td><td class="n">' + num(top) + "</td></tr>"; }).join("") +
      '<tr class="total"><td>Toplam</td><td class="n">' + num(t.magaza) + '</td><td class="n">' + num(t.fabrika) + '</td><td class="n">' + num(t.magaza + t.fabrika) + "</td></tr></tbody></table></div>" +
      '<form id="f-urun" class="panel" style="padding:12px;background:var(--bg)" autocomplete="off">' +
        '<span class="sec">Ürünü düzenle</span>' +
        '<div class="row"><label for="u-ad">Model adı<input id="u-ad" value="' + esc(u.ad || "") + '"></label><label for="u-fiyat">Satış fiyatı ($)<input id="u-fiyat" class="mono" type="number" inputmode="decimal" min="0" step="0.01" value="' + esc(u.fiyat || "") + '"></label></div>' +
        '<div id="u-mesaj"></div><div class="actions"><button class="btn" type="submit">Kaydet</button><button class="btn danger" type="button" id="u-sil">Ürünü sil</button></div>' +
      "</form>";
    $("f-urun").onsubmit = ev => {
      ev.preventDefault();
      const patch = { ad: $("u-ad").value.trim(), fiyat: yuvarla($("u-fiyat").value), guncelleme: new Date().toISOString() };
      sirayla(async () => { try { await db.doc("urunler/" + kod).update(patch); toast(kod + " güncellendi"); } catch (e) { msg("u-mesaj", hata(e)); } });
    };
    let silOnay = false;
    $("u-sil").onclick = () => {
      if (!silOnay) { silOnay = true; $("u-sil").textContent = "Emin misiniz? Tekrar basın"; return; }
      sirayla(async () => { try { await db.doc("urunler/" + kod).delete(); toast(kod + " silindi"); $("ara-kod").value = ""; araCiz(); } catch (e) { msg("u-mesaj", hata(e)); } });
    };
  }

  // ---------- Stok: transfer / sayım ----------
  function dArayuz() {
    const tip = $("d-tip").value;
    $("d-yer-kutu").hidden = tip !== "sayim";
    $("d-adet-etiket").textContent = tip === "sayim" ? "Doğru sayı" : "Adet";
  }
  $("d-tip").addEventListener("change", dArayuz);
  $("d-kod").addEventListener("input", dRenk);
  function dRenk() {
    const u = urunler.get($("d-kod").value.trim()), sel = $("d-renk"), onceki = sel.value;
    sel.innerHTML = u ? '<option value="">Renk</option>' + renkler(u).map(r => '<option value="' + esc(r) + '">' + esc(r) + "</option>").join("") : '<option value="">Kod yazın</option>';
    if (u?.renkler?.[onceki]) sel.value = onceki;
  }
  $("f-duz").addEventListener("submit", ev => {
    ev.preventDefault();
    const tip = $("d-tip").value, kod = $("d-kod").value.trim(), renk = $("d-renk").value, yer = $("d-yer").value;
    const u = urunler.get(kod), m = Number($("d-adet").value);
    if (!u || !renk) return msg("d-mesaj", "Kod ve renk seçin.");
    if ($("d-adet").value === "" || !Number.isInteger(m) || m < 0 || (tip === "transfer" && m === 0)) return msg("d-mesaj", "Adet geçerli bir tam sayı olmalı.");
    const once = stok(u, renk), sonra = { ...once };
    if (tip === "transfer") { if (m > once.fabrika) return msg("d-mesaj", "Fabrikada sadece " + num(once.fabrika) + " adet var."); sonra.fabrika -= m; sonra.magaza += m; }
    else sonra[yer] = m;
    const zaman = new Date().toISOString();
    sirayla(async () => {
      try {
        await db.doc("urunler/" + kod).update({ renkler: { [renk]: sonra }, guncelleme: zaman });
        await gunlugeEkle([{ saat: saat(), zaman, kod, renk, tip, yer: tip === "transfer" ? "fabrika→magaza" : yer, miktar: m, once, sonra }]);
        msg("d-mesaj", ""); $("d-adet").value = "";
        toast("Kaydedildi: " + kod + " " + renk + " · Mağaza " + num(sonra.magaza) + ", Fabrika " + num(sonra.fabrika));
      } catch (e) { msg("d-mesaj", hata(e)); }
    });
  });

  // ---------- Stok: ürün listesi ve yeni ürün ----------
  $("yeni-ac").onclick = () => { $("f-yeni").hidden = false; $("y-kod").focus(); };
  $("yeni-kapat").onclick = () => { $("f-yeni").hidden = true; msg("y-mesaj", ""); };
  $("f-yeni").addEventListener("submit", ev => {
    ev.preventDefault();
    const kod = $("y-kod").value.trim();
    if (!KOD_RE.test(kod)) return msg("y-mesaj", "Stok kodu sadece harf, rakam, - ve _ içerebilir. Boşluk olmamalı.");
    if (urunler.has(kod)) return msg("y-mesaj", "Bu kod zaten kayıtlı: " + kod);
    const rs = [...new Set($("y-renkler").value.split(",").map(s => s.trim()).filter(Boolean))];
    if (!rs.length) return msg("y-mesaj", "En az bir renk yazın.");
    const renkObj = {}; rs.forEach(r => { renkObj[r] = { magaza: 0, fabrika: 0 }; });
    const simdi = new Date().toISOString();
    sirayla(async () => {
      try {
        await db.doc("urunler/" + kod).set({ kod, ad: $("y-ad").value.trim(), fiyat: yuvarla($("y-fiyat").value), renkler: renkObj, olusturma: simdi, guncelleme: simdi });
        $("f-yeni").reset(); $("f-yeni").hidden = true; msg("y-mesaj", "");
        toast(kod + " eklendi. Stoğu Giriş sekmesinden girin.");
      } catch (e) { msg("y-mesaj", hata(e)); }
    });
  });
  ["liste-ara", "liste-filtre"].forEach(id => $(id).addEventListener("input", listeCiz));
  function listeCiz() {
    const q = $("liste-ara").value.trim().toLocaleLowerCase("tr"), f = $("liste-filtre").value;
    let arr = [...urunler.values()].sort((a, b) => String(a.kod).localeCompare(String(b.kod), "tr", { numeric: true }));
    $("urun-sayisi").textContent = "· " + num(arr.length) + " model";
    if (q) arr = arr.filter(u => String(u.kod).toLocaleLowerCase("tr").includes(q) || String(u.ad || "").toLocaleLowerCase("tr").includes(q));
    const t0 = u => renkler(u).filter(r => { const s = stok(u, r); return s.magaza + s.fabrika === 0; }).length;
    if (f === "tukenen") arr = arr.filter(u => t0(u) > 0);
    if (f === "az") arr = arr.filter(u => renkler(u).some(r => { const s = stok(u, r), t = s.magaza + s.fabrika; return t > 0 && t <= AZ_ESIK; }));
    const box = $("liste");
    if (!arr.length) { box.innerHTML = '<p class="empty">' + (urunler.size ? "Bu filtreye uyan ürün yok." : "Henüz ürün yok. Giriş sekmesinden ilk malı girin veya \"+ Yeni ürün\" ile ekleyin.") + "</p>"; return; }
    box.innerHTML = arr.map(u => {
      const t = toplam(u), b = t0(u);
      return '<button type="button" class="item" data-kod="' + esc(u.kod) + '"><span class="k">' + esc(u.kod) + "</span><span>" + esc(u.ad || "—") +
        '<br><span class="sub">' + renkler(u).length + " renk · " + para(u.fiyat) + (b ? ' · <span class="pill zero">' + b + " renk tükendi</span>" : "") + "</span></span>" +
        '<span class="t">' + num(t.magaza) + "<small>mağaza</small>" + num(t.fabrika) + "<small>fabrika</small></span></button>";
    }).join("");
    box.querySelectorAll("[data-kod]").forEach(b => b.addEventListener("click", () => { $("ara-kod").value = b.dataset.kod; araCiz(); $("ara-kod").scrollIntoView({ behavior: "smooth", block: "center" }); }));
  }

  // ---------- Cariler ----------
  $("c-tur").addEventListener("change", () => { $("c-yuzde-kutu").hidden = $("c-tur").value !== "giris"; });
  $("cari-yeni-ac").onclick = () => { $("f-cari").hidden = false; $("c-ad").focus(); };
  $("cari-yeni-kapat").onclick = () => { $("f-cari").hidden = true; msg("c-mesaj", ""); };
  $("f-cari").addEventListener("submit", ev => {
    ev.preventDefault();
    const ad = $("c-ad").value.trim().toLocaleUpperCase("tr");
    if (!ad) return;
    if ([...cariler.values()].some(c => c.ad === ad)) return msg("c-mesaj", "Bu adla bir cari zaten var: " + ad);
    const tur = $("c-tur").value, yz = tur === "giris" ? Number($("c-yuzde").value || 0) : 0;
    if (!(yz >= 0 && yz <= 100)) return msg("c-mesaj", "Yüzde 0 ile 100 arasında olmalı.");
    const simdi = new Date().toISOString();
    sirayla(async () => {
      try {
        const ref = db.collection("cariler").doc();
        await ref.set({ ad, tur, yuzde: yz, tel: $("c-tel").value.trim(), hareketler: [], olusturma: simdi, guncelleme: simdi });
        $("f-cari").reset(); $("f-cari").hidden = true; $("c-yuzde-kutu").hidden = true; msg("c-mesaj", "");
        toast(ad + " eklendi"); acikCari = ref.id;
      } catch (e) { msg("c-mesaj", hata(e)); }
    });
  });
  ["cari-ara", "cari-filtre"].forEach(id => $(id).addEventListener("input", cariListeCiz));
  function cariListeCiz() {
    const q = $("cari-ara").value.trim().toLocaleLowerCase("tr"), f = $("cari-filtre").value;
    let arr = [...cariler.entries()].map(([id, c]) => ({ id, c, b: bakiye(c) }));
    $("cari-sayisi").textContent = "· " + num(arr.length);
    if (q) arr = arr.filter(x => String(x.c.ad).toLocaleLowerCase("tr").includes(q));
    if (TUR[f]) arr = arr.filter(x => x.c.tur === f);
    if (f === "A") arr = arr.filter(x => x.b > 0.004);
    if (f === "B") arr = arr.filter(x => x.b < -0.004);
    arr.sort((a, b) => String(a.c.ad).localeCompare(String(b.c.ad), "tr"));
    const box = $("cari-liste");
    if (!arr.length) { box.innerHTML = '<p class="empty">' + (cariler.size ? "Bu filtreye uyan cari yok." : "Henüz cari yok. \"+ Yeni cari\" ile başlayın (örneğin TOPTAN ve BLACKROSE 20).") + "</p>"; return; }
    box.innerHTML = arr.map(x => '<button type="button" class="item" data-cari="' + esc(x.id) + '"><span class="k" style="min-width:0"></span><span><b>' + esc(x.c.ad) + '</b><br><span class="sub">' + esc(TUR[x.c.tur] || "") + (x.c.tur === "giris" ? ' · <span class="yuzde">%' + num(x.c.yuzde || 0) + "</span>" : "") + "</span></span>" + bakiyeHtml(x.b) + "</button>").join("");
    box.querySelectorAll("[data-cari]").forEach(b => b.addEventListener("click", () => { acikCari = b.dataset.cari; cariDetayCiz(); $("cari-detay").scrollIntoView({ behavior: "smooth", block: "start" }); }));
  }
  let acikCari = null, cizilenCari = null;
  function cariDetayCiz() {
    const box = $("cari-detay"), c = cariler.get(acikCari);
    if (!c) { box.innerHTML = ""; cizilenCari = null; return; }
    const secili = (cizilenCari === acikCari && box.querySelector("#ch-tip")?.value) || (c.tur === "satis" ? "tahsilat" : "odeme");
    cizilenCari = acikCari;
    const hs = (c.hareketler || []).slice().reverse();
    box.innerHTML =
      '<div class="panel detay">' +
        '<div class="card-head"><div><h3 style="font-size:20px">' + esc(c.ad) + '</h3><div class="sub">' + esc(TUR[c.tur] || "") + (c.tur === "giris" ? ' · <span class="yuzde">%' + num(c.yuzde || 0) + "</span>" : "") + (c.tel ? " · " + esc(c.tel) : "") + "</div></div>" + bakiyeHtml(bakiye(c)) + "</div>" +
        '<form id="f-ch" class="panel" style="padding:12px" autocomplete="off">' +
          '<span class="sec">Para hareketi</span>' +
          '<div class="row"><label for="ch-tip">İşlem<select id="ch-tip">' + ["tahsilat", "odeme", "acilis"].map(k => '<option value="' + k + '"' + (k === secili ? " selected" : "") + ">" + CTIP[k].ad + "</option>").join("") + "</select></label>" +
          '<label for="ch-tutar">Tutar ($)<input id="ch-tutar" class="mono" type="number" inputmode="decimal" min="0" step="0.01" required></label></div>' +
          '<label for="ch-yon" id="ch-yon-kutu" hidden>Bakiye harfi (Vegawin\'deki gibi)<select id="ch-yon"><option value="1">(A)</option><option value="-1">(B)</option></select></label>' +
          '<label for="ch-aciklama">Açıklama (isteğe bağlı)<input id="ch-aciklama"></label>' +
          '<p class="sub" id="ch-bilgi"></p><div id="ch-mesaj"></div>' +
          '<button class="btn" type="submit">Kaydet</button>' +
        "</form>" +
        '<span class="sec">Hareketler</span>' +
        '<div class="log">' + (hs.length ? hs.map(x => '<div><span class="mono sub">' + esc(String(x.tarih || "").slice(5).split("-").reverse().join(".")) + '</span><span><span class="tag ' + esc(x.tip) + '">' + esc(CTIP[x.tip]?.ad || x.tip) + "</span> " + esc(x.aciklama || "") + (x.tip === "giris" && x.yuzde ? '<br><span class="sub">Brüt ' + para(x.brut) + " − %" + num(x.yuzde) + "</span>" : "") + '</span><span class="mono">' + (x.etki >= 0 ? "(A) +" : "(B) +") + para(Math.abs(x.etki)) + "</span></div>").join("") : '<p class="empty">Henüz hareket yok.</p>') + "</div>" +
        '<div class="actions"><button class="btn ghost" type="button" id="cd-kapat">Kapat</button><button class="btn danger" type="button" id="cd-sil">Cariyi sil</button></div>' +
      "</div>";
    const bilgi = () => { const t = $("ch-tip").value; $("ch-bilgi").textContent = CTIP[t].aciklama; $("ch-yon-kutu").hidden = t !== "acilis"; };
    $("ch-tip").onchange = bilgi; bilgi();
    $("cd-kapat").onclick = () => { acikCari = null; box.innerHTML = ""; };
    let silOnay = false;
    $("cd-sil").onclick = () => {
      if (!silOnay) { silOnay = true; $("cd-sil").textContent = "Emin misiniz? Tekrar basın"; return; }
      const id = acikCari;
      sirayla(async () => { try { await db.doc("cariler/" + id).delete(); toast(c.ad + " silindi"); acikCari = null; box.innerHTML = ""; } catch (e) { msg("ch-mesaj", hata(e)); } });
    };
    $("f-ch").onsubmit = ev => {
      ev.preventDefault();
      const tip = $("ch-tip").value, tutar = yuvarla($("ch-tutar").value);
      if (!(tutar > 0)) return msg("ch-mesaj", "Tutar sıfırdan büyük olmalı.");
      const etki = tip === "acilis" ? tutar * Number($("ch-yon").value) : CTIP[tip].isaret * tutar;
      const id = acikCari;
      sirayla(async () => {
        try { await cariHareketEkle(id, { tip, tutar, etki, aciklama: $("ch-aciklama").value.trim() }); toast(c.ad + ": " + CTIP[tip].ad + " " + para(tutar)); }
        catch (e) { msg("ch-mesaj", hata(e)); }
      });
    };
  }

  // ---------- Geçmiş ----------
  const TIPAD = { satis: "Satış", giris: "Giriş", transfer: "Transfer", sayim: "Sayım" };
  $("gc-tarih").value = bugun();
  $("gc-tarih").addEventListener("change", gecmisYukle);
  async function gecmisYukle() {
    const box = $("gc-liste");
    if (!db) { box.innerHTML = '<p class="empty">Bağlantı yok.</p>'; return; }
    box.innerHTML = '<p class="empty">Yükleniyor…</p>';
    try {
      const g = await db.doc("gunluk/" + $("gc-tarih").value).get();
      const k = g.exists ? (g.data().kayitlar || []) : [];
      const say = t => k.filter(x => x.tip === t).reduce((s, x) => s + Number(x.miktar || 0), 0);
      $("gc-ozet").textContent = k.length ? k.length + " kayıt · Satış " + num(say("satis")) + " adet · Giriş " + num(say("giris")) + " adet · Transfer " + num(say("transfer")) + " adet" : "";
      box.innerHTML = k.length ? k.slice().reverse().map(x =>
        '<div><span class="mono sub">' + esc(x.saat) + '</span><span><span class="tag ' + (x.tip === "giris" ? "stokgiris" : esc(x.tip)) + '">' + esc(TIPAD[x.tip] || x.tip) + '</span> <b class="mono">' + esc(x.kod) + "</b> " + esc(x.renk) +
        '<br><span class="sub">' + (x.tip === "transfer" ? "Fabrika → Mağaza" : YER[x.yer] || "") + (x.cari ? " · " + esc(x.cari) : "") + (x.not ? " · " + esc(x.not) : "") + '</span></span><span class="mono">' + (x.tip === "sayim" ? "=" : x.tip === "satis" ? "−" : "+") + num(x.miktar) + "</span></div>"
      ).join("") : '<p class="empty">Bu tarihte hareket yok.</p>';
    } catch (e) { box.innerHTML = '<p class="msg err">' + esc(hata(e)) + "</p>"; }
  }

  // ---------- Başlangıç ----------
  dArayuz(); listeCiz(); cariListeCiz();
  cariSecenekleri($("s-cari"), "satis"); cariSecenekleri($("g-cari"), "giris");

  (async () => {
    db = window.claude?.use ? await window.claude.use("db") : null;
    if (!db) { durum("Bağlantı yok", "bad"); msg("s-mesaj", "Veritabanına bağlanılamadı. Programı claude.ai içinde açın."); return; }
    durum("Bağlı", "ok");
    db.collection("urunler").limit(1000).onSnapshot(snap => {
      urunler.clear();
      snap.docs.forEach(d => { const v = d.data(); urunler.set(d.id, { ...v, kod: v.kod || d.id }); });
      $("kodlar").innerHTML = [...urunler.keys()].map(k => '<option value="' + esc(k) + '">').join("");
      araCiz(); listeCiz(); dRenk(); satisSepet.renkGuncelle(); girisSepet.renkGuncelle();
      durum("Bağlı · " + num(urunler.size) + " model", "ok");
    }, () => durum("Bağlantı koptu", "bad"));
    db.collection("cariler").limit(1000).onSnapshot(snap => {
      cariler.clear();
      snap.docs.forEach(d => cariler.set(d.id, d.data()));
      cariListeCiz(); cariSecenekleri($("s-cari"), "satis"); cariSecenekleri($("g-cari"), "giris");
      satisSepet.ciz(); girisSepet.ciz(); girisSepet.cariBilgi();
      if (acikCari) cariDetayCiz();
    }, () => { $("cari-liste").innerHTML = '<p class="msg err">Cariler yüklenemedi. Sayfayı yenileyin.</p>'; });
  })();
})();
</script>
