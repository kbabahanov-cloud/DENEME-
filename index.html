<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deneme Sayfası</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    main {
      max-width: 480px;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    button {
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Merhaba!</h1>
    <p>Bu, DENEME- projesi için basit bir HTML sayfasıdır.</p>
    <button id="buton">Tıkla</button>
    <p id="sayac">Henüz tıklanmadı.</p>
  </main>

  <script>
    let sayi = 0;
    document.getElementById("buton").addEventListener("click", function () {
      sayi++;
      document.getElementById("sayac").textContent = sayi + " kez tıklandı.";
    });
  </script>
</body>
</html>
